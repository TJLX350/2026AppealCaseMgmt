  async function nativeSharePayload(payload, prefer) {
    // prefer: 'share' | 'sms' | 'email' | 'copy'
    if (!payload) {
      alert('Nothing to share — highlight text for selection, or open a page/section.');
      return;
    }
    const title = payload.title || 'Evich Case Tracker';
    const text = payload.text || '';
    const url = payload.url || '';

    if (prefer === 'sms') {
      // Native SMS / Messages app
      const body = encodeURIComponent((text + (url ? '\n' + url : '')).slice(0, 1500));
      window.location.href = 'sms:?&body=' + body;
      return;
    }
    if (prefer === 'email') {
      const sub = encodeURIComponent(title);
      const body = encodeURIComponent((text + (url ? '\n\n' + url : '')).slice(0, 8000));
      window.location.href = 'mailto:?subject=' + sub + '&body=' + body;
      return;
    }
    if (prefer === 'copy' || !navigator.share) {
      try {
        await navigator.clipboard.writeText((text + (url ? '\n' + url : '')).slice(0, 20000));
        alert('Copied to clipboard. Paste into any app.');
      } catch (e) {
        showAppError(e, 'generic');
      }
      return;
    }
    // Native share sheet (includes Messages, Mail, etc. on device)
    try {
      const data = { title: title, text: text };
      if (url) data.url = url;
      // Some browsers require files omitted; screenshot is separate
      if (navigator.canShare && url && !navigator.canShare(data)) {
        await navigator.share({ title: title, text: text + '\n' + url });
      } else {
        await navigator.share(data);
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      // fallback copy
      try {
        await navigator.clipboard.writeText(text + (url ? '\n' + url : ''));
        alert('Share sheet unavailable — copied to clipboard.');
      } catch (e2) {
        showAppError(e, 'generic');
      }
    }
  }

  function installKeyboardShortcuts() {
    if (window.__evichKeysInstalled) return;
    window.__evichKeysInstalled = true;
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (isTypingTarget(e.target)) {
        if (e.key === 'Escape') {
          // still allow Esc to blur/close
          closeFloatingMenus();
          closeNavDrawer();
        }
        return;
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        closeFloatingMenus();
        closeNavDrawer();
        return;
      }
      if (e.key === '?' || (e.shiftKey && e.key === '/')) {
        e.preventDefault();
        openShortcutsHelp();
        return;
      }
      const k = (e.key || '').toLowerCase();
      if (k === 'h') {
        e.preventDefault();
        currentLane = null;
        try { sessionStorage.setItem('evich_helper_classic_doors', '1'); } catch (err) {}
        render();
      } else if (k === 'm' || k === '/') {
        e.preventDefault();
        openNavDrawer();
      } else if (k === 's') {
        e.preventDefault();
        openShareMenu();
      } else if (k === 'p') {
        e.preventDefault();
        openPrintMenu();
      } else if (k === 'n') {
        e.preventDefault();
        openNotebookLmFromPwa();
      } else if (k === 'l') {
        e.preventDefault();
        openMyLinksEditor();
      } else if (k === 'q') {
        e.preventDefault();
        if (!sessionMode) lockSessionMode('stephanie');
        if (!currentLane) currentLane = 'appeal';

      } else if (e.key === '2' && document.querySelector('.print-menu')) {

      const gh = EvichGuide.loadOwnerGithub();
      const gb = el('div', 'github-badge',
        'Owner build ' + (gh.currentVersion || '') +
        (gh.repoUrl ? ' · ' + gh.repoUrl : ' · set GitHub repo in Owner Tools') +
        (gh.releaseTag ? ' · tag ' + gh.releaseTag : ''));
      header.appendChild(gb);
    }
    root.classList.toggle('wide-view', wideView);
    const vh = el('div', 'version-history', 'Full version history now lives under Case Foundation \u2192 Version History.');
    header.appendChild(vh);
    root.appendChild(header);
    renderExternalReturnBanner(root);

    const tabsWrap = el('div', 'maintabs-wrap');
    const maintabs = el('div', 'maintabs');
    const tabDefs = [ ['foundation','Case Foundation'], ...laneTabDefs(), ['labels','Label Tracker'], ['voice','Notes'] ];
    tabDefs.forEach(([key, label]) => {
      const t = el('div', 'maintab' + (mainTab === key ? ' active' : ''), label);
      t.onclick = function() { navigateTo({ lane: currentLane, tab: key }); };
      maintabs.appendChild(t);
    });
    tabsWrap.appendChild(maintabs);
    const stephPin = el('button', 'maintab-pin' + (mainTab === 'stephanie' ? ' active' : ''), 'Stephanie');
    stephPin.type = 'button';
    stephPin.title = "Stephanie's World — always on screen";
    stephPin.onclick = function() { navigateTo({ lane: currentLane || 'appeal', tab: 'stephanie' }); };
    tabsWrap.appendChild(stephPin);
    root.appendChild(tabsWrap);

    const panel = el('div', 'body-panel');
    if (mainTab === 'foundation') renderFoundation(panel);
    else if (mainTab === 'issue1') await renderIssue(panel);
    else if (mainTab === 'appealreq') renderAppealRequirements(panel);
    else if (mainTab === 'cba') await renderCBA(panel);
    else if (mainTab === 'flowbenefit') renderFlowBenefit(panel);
    else if (mainTab === 'oarc') renderOARC(panel);
    else if (mainTab === 'review') await renderFilesNeedingReview(panel);
    else if (mainTab === 'translator') renderTranslator(panel);
    else if (mainTab === 'premortem') renderPremortem(panel);
    else if (mainTab === 'query') await renderQueryInterface(panel);
    else if (mainTab === 'toolbox') await renderToolbox(panel);
    else if (mainTab === 'stephanie') renderStephanieWorld(panel);
    else if (mainTab === 'labels') renderLabelTracker(panel);
    else if (mainTab === 'voice') renderNotesTab(panel);
    else {
      // Unknown tab — recover instead of blank/wrong panel
      console.warn('Unknown mainTab', mainTab, 'for lane', currentLane);
      mainTab = defaultTabForLane(currentLane);
      if (mainTab === 'cba') await renderCBA(panel);
      else if (mainTab === 'oarc') renderOARC(panel);
      else renderFoundation(panel);
    }
    root.appendChild(panel);
    wrapPanelForPrintHints(panel);

    renderMasterMic(root);
    renderHelpBuddy(root);
    renderDrivePreviewModal(root);
    loadActivityLog();
    mountHeaderClaudeButton();
    mountClaudePip();
    // destroy any stray Claude fabs
    try {
      var stray = document.getElementById('claude-pip-fab');
      if (stray) stray.remove();
    } catch (e) {}
    if (currentLane) {
      try { renderCaseSwitcher(root); } catch (e) {}
    }
    if (sessionMode === 'stephanie' && currentLane) {
      rememberHereQuietly();
      try {
        const tabs = root.querySelector('.maintabs-wrap');
        if (tabs && !root.querySelector('.drop-plop-bar')) {
          const barHost = el('div', null);
          renderDropPlopBar(barHost);
          if (barHost.firstChild) tabs.after(barHost.firstChild);
        }
      } catch (e) {}
    }
  }

  (async function init() {
    loadActivityLog();
    loadBookmarks();
    await loadVoiceLog();
    await loadLedger();
    await loadStephanieLinks();
    await loadLabelEntries();
    await loadDocLinkProgress();
    lastExportTime = await storageGet('last_export_time');
    const wv = await storageGet('wide_view');
    wideView = wv === '1';
    try {
      const raw = localStorage.getItem('evich_premortem_done');
      if (raw) premortemDone = JSON.parse(raw) || {};
    } catch (e) {}
    if (window.EvichGuide) {
      try { await loadSavedQueryResults(); } catch (e) {}
      try { await EvichGuide.openDb(); } catch (e) {}
      try { activeAccountId = EvichGuide.getActiveAccountId(); } catch (e) {}
      try { ensureSessionMode(); } catch (e) {}
    }
    installKeyboardShortcuts();

    render();
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js').catch(function(e){ console.warn('SW reg failed', e); });
    });
  }
</script>

</body>
</html>
